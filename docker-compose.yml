version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: argon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: argon
      POSTGRES_PASSWORD: argon
      POSTGRES_DB: argon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argon -d argon"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: argon-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: wait for MinIO, then create the bucket idempotently.
  minio-init:
    image: minio/mc:latest
    container_name: argon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb --ignore-existing local/argon-images) &&
      mc anonymous set download local/argon-images || true;
      "

volumes:
  pgdata:
  miniodata:
